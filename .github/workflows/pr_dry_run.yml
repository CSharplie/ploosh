name: 'Dry run'

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
  workflow_dispatch:
jobs:
  dry_run:
    name: 'Execute dry run'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
      - name: Init environment 
        run: |        
          python -m venv .build
          python -m venv .dryrun
      - name: Build package
        run: |
          . .build/bin/activate

          pip install --upgrade pip

          pip install build==1.5.0
          pip install twine==6.0.1

          python -m build
          twine check dist/*
      - name: Execute ploosh
        run: | 
          . .dryrun/bin/activate

          pip install --upgrade pip

          package_path=`ls dist/* | grep .whl`
          pip install "$package_path[full]"

          ploosh --cases "tests/.env/exec/" -filter "dry_run_native.yaml" --failure false

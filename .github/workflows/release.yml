name: 'Release on PyPi'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version part to bump'
        required: true
        default: 'PATCH'
        type: choice
        options:
          - PATCH
          - MINOR
          - MAJOR

permissions:
  contents: write

jobs:
  publish:
    name: 'Publish on PyPi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
      - name: Install requirements
        run: |
          pip install -r src/requirements.txt
          pip install commitizen==4.15.1 build==1.5.0 twine==6.2.0
      - name: Check if bump needed
        id: check
        run: |
          # Do not bump on tag pushes; tags publish without bumping
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "skip_bump=true" >> $GITHUB_OUTPUT
          else
            echo "skip_bump=false" >> $GITHUB_OUTPUT
          fi
      - name: Bump version with Commitizen
        if: steps.check.outputs.skip_bump == 'false'
        run: cz bump --yes --increment "${{ github.event.inputs.increment || 'PATCH' }}"
      - name: Push bumped version back to repository
        if: steps.check.outputs.skip_bump == 'false'
        run: |
          branch=${GITHUB_REF#refs/heads/}
          git push origin HEAD:$branch --follow-tags
      - name: Clean previous build artifacts
        run: rm -rf dist
      - name: Build package
        run: python -m build
      - name: Check package
        run: twine check dist/*
      - name: Publish
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "Deploying to production environment"
            twine upload --repository-url https://upload.pypi.org/legacy/ dist/* -u ${{ secrets.PYPI_USER }} -p '${{ secrets.PYPI_PASSWORD }}' --verbose
          else
            echo "Deploying to test environment"
            twine upload --repository-url https://test.pypi.org/legacy/ dist/* -u ${{ secrets.PYPI_TEST_USER }} -p '${{ secrets.PYPI_TEST_PASSWORD }}' --verbose
          fi